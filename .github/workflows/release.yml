# Compila, prueba, firma y publica la APK en Releases al subir una etiqueta vX.Y.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # necesario únicamente para crear la Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Comprueba que gradle-wrapper.jar es el binario oficial de Gradle.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Comprobar que la etiqueta coincide con versionName
        run: |
          chmod +x gradlew
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con versionName ($version)"
            exit 1
          fi

      - name: Tests y lint
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Compilar y firmar
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SIGNING_KEYSTORE_BASE64; no se publica una APK firmada con clave de depuración"
            exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # Se eliminan saltos de línea y espacios que se cuelan al copiar el secreto desde Windows.
          keystore_b64=$(printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n\t ')
          invalid=$(printf '%s' "$keystore_b64" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if [ "$invalid" -ne 0 ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 contiene $invalid caracteres no válidos (longitud: ${#keystore_b64})"
            exit 1
          fi
          printf '%s' "$keystore_b64" | base64 --decode > "$SIGNING_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$SIGNING_KEYSTORE_FILE"

      - name: Preparar archivos
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NeuDNS-$GITHUB_REF_NAME.apk"
          cd dist
          sha256sum "NeuDNS-$GITHUB_REF_NAME.apk" > "NeuDNS-$GITHUB_REF_NAME.apk.sha256"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NeuDNS $GITHUB_REF_NAME" --generate-notes
